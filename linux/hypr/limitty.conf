# Limitty for Hyprland (hyprland.conf syntax, Hyprland 0.53+).
# Included by:  source = ~/.config/hypr/limitty.conf
# Using hyprland.lua instead? Use limitty.lua. On Hyprland 0.52 or older, see the
# windowrulev2 lines at the bottom.

# The widget: small, floating, on every workspace, top-right, no focus stealing.
windowrule = float on, match:title ^Limitty$
windowrule = pin on, match:title ^Limitty$
windowrule = move (monitor_w-window_w-16) 56, match:title ^Limitty$
windowrule = no_initial_focus on, match:title ^Limitty$
windowrule = border_size 0, match:title ^Limitty$
windowrule = no_shadow on, match:title ^Limitty$
windowrule = no_blur on, match:title ^Limitty$

# The Company window: a normal floating window.
windowrule = float on, match:title ^Limitty Company$
windowrule = size 820 760, match:title ^Limitty Company$
windowrule = center on, match:title ^Limitty Company$

# Start with Hyprland.
exec-once = limitty

# Optional keybinds (pick keys that don't clash with yours):
# bind = SUPER ALT, L, exec, limitty --toggle
# bind = SUPER ALT, C, exec, limitty --company

# Hyprland 0.52 and older:
# windowrulev2 = float, title:^(Limitty)$
# windowrulev2 = pin, title:^(Limitty)$
# windowrulev2 = move 100%-w-16 56, title:^(Limitty)$
# windowrulev2 = noinitialfocus, title:^(Limitty)$
# windowrulev2 = noborder, title:^(Limitty)$
# windowrulev2 = noshadow, title:^(Limitty)$
# windowrulev2 = noblur, title:^(Limitty)$
# windowrulev2 = float, title:^(Limitty Company)$
# windowrulev2 = size 820 760, title:^(Limitty Company)$
